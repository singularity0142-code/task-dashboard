  const [showTrash,setShowTrash]=useState(false);
  return(
    <div className="av-reply-panel" onClick={e=>e.stopPropagation()}>
      <div className="av-reply-hd">
        <button onClick={()=>setShowTrash(s=>!s)} title="回收箱"
          style={{background:'none',border:'none',cursor:'pointer',fontSize:'.85rem',padding:'0 4px',color:showTrash?'#DC2626':'#9CA3AF',position:'relative'}}>
          🗑️
          {trashItems.length>0&&<span style={{position:'absolute',top:-3,right:-2,background:'#DC2626',color:'#fff',borderRadius:'50%',fontSize:'.45rem',width:11,height:11,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{trashItems.length}</span>}
        </button>
        <span className="av-reply-hd-title" style={{flex:1}}>{showTrash?'🗑️ 回收箱':'📩 奇点汇报'}</span>
        <button className="av-reply-close" onClick={onClose}>✕</button>
      </div>
      <div className="av-reply-body">
        {showTrash?(
          trashItems.length===0
            ?<div className="av-reply-empty">回收箱为空</div>
            :trashItems.map(it=>(
              <div key={it.key} className="av-reply-item">
                <div className="av-reply-who" style={{opacity:.6}}>
                  {it.assignee}<span className="av-reply-task">· {it.task}</span>
                  {it.time&&<span className="av-reply-time">{it.time}</span>}
                  <span style={{flex:1}}/>
                  <button onClick={()=>onRestore&&onRestore(it)} style={{fontSize:'.6rem',padding:'2px 7px',borderRadius:6,border:'1px solid #93C5FD',background:'#EFF6FF',color:'#1D4ED8',cursor:'pointer',fontWeight:700,flexShrink:0}}>恢复</button>
                </div>
                <div className="av-reply-text" style={{marginTop:4,opacity:.55}}>{it.text}</div>
              </div>
            ))
        ):(
          replies.length===0
            ?<div className="av-reply-empty">暂无未处理回复</div>
            :replies.map((it,i)=>(
              <div key={it.key} className="av-reply-item" style={{cursor:'pointer'}} onClick={()=>setExpanded(expanded===i?null:i)}>
                <div className="av-reply-who">
                  <span style={{marginRight:4,fontSize:'.6rem',color:'#475569'}}>{expanded===i?'▾':'▸'}</span>
                  {it.assignee}<span className="av-reply-task">· {it.task}</span>
                  {it.time&&<span className="av-reply-time">{it.time}</span>}
                  <span style={{flex:1}}/>
                  <button onClick={e=>{e.stopPropagation();onAck&&onAck(it);}} style={{fontSize:'.6rem',padding:'2px 7px',borderRadius:6,border:'1px solid #22C55E',background:'#F0FDF4',color:'#15803D',cursor:'pointer',fontWeight:700,flexShrink:0,marginRight:4}}>已阅</button>
                  <button onClick={e=>{e.stopPropagation();onDelete&&onDelete(it);}} style={{fontSize:'.6rem',padding:'2px 7px',borderRadius:6,border:'1px solid #FCA5A5',background:'#FFF5F5',color:'#DC2626',cursor:'pointer',fontWeight:700,flexShrink:0}}>删除</button>
                </div>
                {expanded===i&&<div className="av-reply-text" style={{marginTop:5}}>{it.text}</div>}
              </div>
            ))
        )}
      </div>
    </div>
  );
}

/* localStorage helpers for reply state */
function lsGet(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* WALL-E Avatar — click to hear report or view replies; large=true for home page center */
function Avatar({tasks, large}){
  const [talking,setTalking]=useState(false);
  const [tilt,setTilt]=useState(false);
  const [ripple,setRipple]=useState(false);
  const [bubble,setBubble]=useState('嘟嘟~ 点我听汇报');
  const [bars,setBars]=useState([2,4,2,4,2]);
  const [mood,setMood]=useState('');
  const [replies,setReplies]=useState([]);
  const [hasNew,setHasNew]=useState(false);
  const [panelOpen,setPanelOpen]=useState(false);
  // 已阅 keys（持久化）
  const [ackedKeys,setAckedKeys]=useState(()=>new Set(lsGet('qd_acked',[])));
  // 回收箱条目（持久化）
  const [trashItems,setTrashItems]=useState(()=>lsGet('qd_trash',[]));
  const barTimerRef=useRef(null);
  const moodRef=useRef(null);
  // seenRef 初始时包含已处理的 key，避免重新拉进来
  const seenRef=useRef(new Set([...lsGet('qd_acked',[]),...lsGet('qd_trash',[]).map(t=>t.key)]));
  const msgTimeoutRef=useRef(null);

  // Stage D.3 — poll /api/messages?direction=executive_to_qidian instead of regex'ing
  // boss_tasks.description for "回复" lines. Each event carries the parent task title +
  // assignee (joined by the bridge endpoint) so the UI can render the same shape.
  useEffect(()=>{
    const poll=async()=>{
      const r=await bridgeFetch('/api/messages?direction=executive_to_qidian&limit=50');
      if(!r.ok || !r.data || !Array.isArray(r.data.messages)) return;
      const fresh=[];
      r.data.messages.forEach(m=>{
        const eventId=m.id!=null?String(m.id):'';
        const key=eventId?`${m.dashboard_id||m.request_code}||${eventId}`:`${m.dashboard_id||m.request_code}||${(m.text||'').slice(0,30)}`;
        if(!seenRef.current.has(key)){
          seenRef.current.add(key);
          const time=m.created_at?new Date(m.created_at).toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'):'';
          fresh.push({
            key,
            task:m.task_title||'',
            assignee:m.task_assignee||m.from_name||'',
            time,
            text:m.text||'',
            request_code:m.request_code,
            bossTaskId:m.dashboard_id,
          });
        }
      });
      if(fresh.length>0){
        setReplies(p=>[...fresh,...p].slice(0,30));
        setHasNew(true);
        setBubble('嘟嘟有新消息 🔴');
      }
    };
    poll();
    const t=setInterval(poll,15000);
    // 同步 App 检测到的新回复 → 立即亮灯 + 播音效
    const onNew=()=>{
      setHasNew(true);
      setBubble('嘟嘟有新消息 🔴');
      playNewMsgSound();
    };
    window.addEventListener('qidian_new_reply',onNew);
    return()=>{clearInterval(t);window.removeEventListener('qidian_new_reply',onNew);};
  },[]);

  // Random mood cycling — pauses while talking or panel open
  useEffect(()=>{
    if(talking||panelOpen){setMood('');return;}
    const POOL=['wave','wave','excited','dance','lookaround','jump','lookaround','wave','','wave','dance','excited'];
    const next=()=>{
      const lo=large?2000:4000, hi=large?5000:11000;
      moodRef.current=setTimeout(()=>{
        const m=POOL[Math.floor(Math.random()*POOL.length)];
        setMood(m);
        if(m==='jump') setTimeout(()=>setMood(''),1100);
        next();
      }, lo+Math.random()*hi);
    };
    next();
    return()=>clearTimeout(moodRef.current);
  },[talking, panelOpen, large]);

  const genReport=()=>{
    const total=tasks.length;
    if(!total) return '老板好，目前暂无任务，可以点击新建任务开始工作规划。';
    const done=tasks.filter(t=>t.status==='completed').length;
    const doing=tasks.filter(t=>t.status==='in-progress').length;
    const blocked=tasks.filter(t=>t.status==='blocked').length;
    const pending=tasks.filter(t=>t.status==='pending').length;
    const rate=Math.round(done/total*100);
    const today=new Date();today.setHours(0,0,0,0);
    const overdue=tasks.filter(t=>t.status!=='completed'&&t.deadline&&new Date(t.deadline)<today);
    let r=`老板您好，以下是当前工作汇报。共${total}项任务，完成率${rate}%。已完成${done}项，进行中${doing}项，未开始${pending}项。`;
    if(blocked>0){r+=`有${blocked}项卡点，请关注：`;tasks.filter(t=>t.status==='blocked').forEach(t=>{r+=t.blocker?`${t.name}，原因${t.blocker}。`:`${t.name}原因待补充。`;});}
    if(overdue.length>0) r+=`另有${overdue.length}项逾期，建议跟进。`;
    if(rate===100) r+='全部完成，辛苦啦！';
    else if(rate>=70) r+='整体正常，请放心。';
    else r+='团队会加快推进，请稍等。';
    return r;
  };

  // 停止当前一切播报（取消pending倒计时 + 停TTS）
  const stopAll=()=>{
    if(msgTimeoutRef.current){clearTimeout(msgTimeoutRef.current);msgTimeoutRef.current=null;}
    window.speechSynthesis.cancel();
    clearInterval(barTimerRef.current);
    setTalking(false);setRipple(false);setBars([2,4,2,4,2]);
  };

  const handleClick=async(e)=>{
    e.stopPropagation();
    // 有新消息 → 播音效 + 打开面板 + 语音播报新回复
    if(hasNew||panelOpen){
      const next=!panelOpen;
      setPanelOpen(next);
      if(next){
        setHasNew(false);
        setBubble('嘟嘟有新消息 🔴');
        playNewMsgSound();
        if(replies.length>0){
          msgTimeoutRef.current=setTimeout(async()=>{
            msgTimeoutRef.current=null;
            setTalking(true);
            barTimerRef.current=setInterval(()=>setBars([...Array(5)].map(()=>Math.floor(Math.random()*7)+2)),130);
            const latest=replies.slice(0,3);
            let report='老板，奇点收到'+replies.length+'条新回复。';
            latest.forEach(r=>{report+=r.assignee+'关于'+r.task+'回复说：'+r.text+'。';});
            await makeTTS(report);
            clearInterval(barTimerRef.current);
            setTalking(false);setBars([2,4,2,4,2]);
            setBubble('嘟嘟~ 点我听汇报'); // 播完提示可听工作汇报
          },1300);
        }
      } else {
        // 关闭面板：取消还没开始的回复播报
        stopAll();
        setBubble('嘟嘟~ 点我听汇报');
      }
      return;
    }
    // 无新消息；汇报中再点击 → 停止
    if(talking){
      stopAll();
      setTilt(false);setBubble('嘟嘟~ 点我听汇报');
      return;
    }
    beepFn(880,.08,0);beepFn(1047,.08,.12);beepFn(1319,.08,.24);beepFn(1568,.15,.36);
    setTilt(true);setRipple(true);
    const total=tasks.length,done=tasks.filter(t=>t.status==='completed').length;
    setBubble(total===0?'暂无任务，快添加！':`${total}项任务 · 完成${Math.round(done/(total||1)*100)}%`);
    await new Promise(r=>setTimeout(r,560));
    setTalking(true);
    barTimerRef.current=setInterval(()=>setBars([...Array(5)].map(()=>Math.floor(Math.random()*7)+2)),130);
    await makeTTS(genReport());
    clearInterval(barTimerRef.current);setTalking(false);setRipple(false);setBars([2,4,2,4,2]);
    beepFn(880,.08,0);beepFn(659,.08,.11);beepFn(523,.22,.22);
    setBubble('汇报完毕 ✅');
    setTimeout(()=>{setTilt(false);setBubble('嘟嘟~ 点我听汇报');},3000);
  };

  const moodClass=talking?'':mood?' mood-'+mood:'';

  const robotEl=(
    <div className={`rv${talking?' talking':''}${moodClass}`} onClick={handleClick} style={{cursor:'pointer'}}>
      <div className="rv-wheel l"><div className="rv-hub"/><div className="rv-spoke h"/><div className="rv-spoke v"/></div>
      <div className="rv-wheel r"><div className="rv-hub"/><div className="rv-spoke h"/><div className="rv-spoke v"/></div>
      <div className="rv-axle"/>
      <div className="rv-arm l"><div className="rv-shoulder"/><div className="rv-ua"/><div className="rv-elbow"/><div className="rv-fa"/><div className="rv-claw"><div className="rv-cp l"/><div className="rv-cp r"/></div></div>
      <div className="rv-arm r"><div className="rv-shoulder"/><div className="rv-ua"/><div className="rv-elbow"/><div className="rv-fa"/><div className="rv-claw"><div className="rv-cp l"/><div className="rv-cp r"/></div></div>
      <div className="rv-body"><div className="rv-bp"><div className="rv-led r"/><div className="rv-led g"/></div></div>
      <div className="rv-head">
        <div className="rv-rv l"/><div className="rv-rv r"/>
        <div className={`rv-eyes${tilt?' tilt':''}`}>
          <div className="rv-ebridge"/>
          <div className="rv-eu"><div className="rv-iris"><div className="rv-lens"/></div></div>
          <div className="rv-eu"><div className="rv-iris"><div className="rv-lens"/></div></div>
        </div>
        <div className="rv-grille">{bars.map((h,i)=><div key={i} className="rv-bar" style={{height:`${h}px`}}/>)}</div>
      </div>
    </div>
  );

  const handleAck=async(reply)=>{
    // Stage C.4 — POST /boss-ack writes message_events with direction='boss_to_qidian'.
    // Prefer reply.request_code (set by D.3 message poll); fall back to id reverse-lookup
    // for any legacy entries that came in via the older description regex path.
    const rc=reply.request_code||await getRequestCodeForBossTask(reply.bossTaskId||reply.key.split('||')[0]);
    if(rc){
      bridgeFetch('/api/tasks/'+encodeURIComponent(rc)+'/boss-ack',{
        method:'POST',
        body:{text:(reply.text||'').slice(0,60),from_name:'boss'},
      });
    }
    window.dispatchEvent(new CustomEvent('boss_task_acked',{detail:{btId:reply.bossTaskId,assignee:reply.assignee,task:reply.task}}));
    const next=new Set([...ackedKeys,reply.key]);
    setAckedKeys(next);
    lsSet('qd_acked',[...next]);
    setReplies(p=>p.filter(r=>r.key!==reply.key));
  };

  const handleDelete=(reply)=>{
    const next=[reply,...trashItems];
    setTrashItems(next);
    lsSet('qd_trash',next);
    setReplies(p=>p.filter(r=>r.key!==reply.key));
    // seenRef 已含此 key，不会再拉进来
  };

  const handleRestore=(reply)=>{
    const next=trashItems.filter(t=>t.key!==reply.key);
    setTrashItems(next);
    lsSet('qd_trash',next);
    setReplies(p=>[reply,...p]);
    // 判断是否需要触发 hasNew
    setHasNew(true);
    setBubble('嘟嘟有新消息 🔴');
  };

  if(large) return(
    <div className="rv-center-wrap" style={{userSelect:'none',position:'relative'}}>
      {panelOpen&&<ReplyPanel replies={replies} trashItems={trashItems} onClose={()=>setPanelOpen(false)} onAck={handleAck} onDelete={handleDelete} onRestore={handleRestore}/>}
      {robotEl}
      <div className={`av-bubble${hasNew&&!panelOpen?' has-msg':''}`} onClick={handleClick} style={{cursor:'pointer',position:'relative'}}>
        {hasNew&&!panelOpen&&<span className="av-new-dot"/>}{bubble}
      </div>
    </div>
  );

  return(
    <div className="av-wrap">
      {/* 消息面板 */}
      {panelOpen&&<ReplyPanel replies={replies} trashItems={trashItems} onClose={()=>setPanelOpen(false)} onAck={handleAck} onDelete={handleDelete} onRestore={handleRestore}/>}
      {/* 气泡在机器人头顶 — flex column，先渲染=上方 */}
      <div className={`av-bubble${hasNew&&!panelOpen?' has-msg':''}`} onClick={handleClick}>
        {hasNew&&!panelOpen&&<span className="av-new-dot"/>}{bubble}
      </div>
      {ripple&&<div className="av-ripple" style={{position:'absolute',bottom:0,left:'50%',transform:'translate(-50%,-50%)'}}/>}
      {robotEl}
    </div>
  );
}

/* ── Missing-field picker helpers ── */
const _pad2=n=>String(n).padStart(2,'0');
const _isoDate=d=>`${d.getFullYear()}-${_pad2(d.getMonth()+1)}-${_pad2(d.getDate())}`;
// Storage format: "YYYY-MM-DD HH:MM" — Postgres timestamptz happy, human readable, no tz ambiguity inside one app.
const _isoDateTime=d=>`${_isoDate(d)} ${_pad2(d.getHours())}:${_pad2(d.getMinutes())}`;
// datetime-local input value format (T-separated, no seconds)
const _toLocalInputValue=d=>`${_isoDate(d)}T${_pad2(d.getHours())}:${_pad2(d.getMinutes())}`;
// Friendly display: parses both "YYYY-MM-DD HH:MM" and ISO; falls back to raw string
function _formatDeadline(s){
  if(!s) return '';
  const d=new Date(s.includes('T')?s:s.replace(' ','T'));
  if(isNaN(d)) return s;
  return _isoDateTime(d);
}
// Normalize date-only string ("2026-05-12") to date+time string ("2026-05-12 18:00") — default EOD
function _normalizeDeadline(s){
  if(!s) return s;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s+' 18:00';
  return s;
}
function deadlineQuickOptions(){
  const t=new Date();
  const setEOD=d=>{d.setHours(18,0,0,0);return d;};
  const today=setEOD(new Date(t));
  const tomorrow=new Date(t); tomorrow.setDate(t.getDate()+1); setEOD(tomorrow);
  const eow=new Date(t); eow.setDate(t.getDate()+(7-t.getDay()||7)); setEOD(eow);
  const eonw=new Date(eow); eonw.setDate(eow.getDate()+7); setEOD(eonw);
  return [
    {value:_isoDateTime(today),    label:'今天18:00'},
    {value:_isoDateTime(tomorrow), label:'明天18:00'},
    {value:_isoDateTime(eow),      label:'本周末18:00'},
    {value:_isoDateTime(eonw),     label:'下周末18:00'},
  ];
}
function assigneeOptions(){
  return Object.keys(MEMBER_ALIASES).map(n=>({value:n,label:n}));
}
function projectOptions(){
  return PROJECTS.map(p=>({value:p,label:p}));
}

/* Voice → option matchers (return matched option.value or null) */
function matchAssigneeFromVoice(transcript){
  const ql=transcript.toLowerCase();
  for(const [alias,name] of Object.entries(ALIAS_MAP)){
    if(ql.includes(alias)) return name;
  }
  return null;
}
// Try to extract HH:MM from transcript; return [HH, MM] or null
function _parseTimeFromVoice(t){
  // "下午5点" / "下午5点半" / "下午5点30分" / "晚上8点"
  let mm=t.match(/(早上|上午|中午|下午|晚上|傍晚)?\s*(\d{1,2})\s*点(半|\s*(\d{1,2})\s*分?)?/);
  if(mm){
    let h=parseInt(mm[2]);
    const period=mm[1]||'';
    if(/下午|晚上|傍晚/.test(period) && h<12) h+=12;
    if(/中午/.test(period) && h<12) h+=12;
    let m=0;
    if(mm[3]==='半') m=30;
    else if(mm[4]) m=parseInt(mm[4]);
    return [h,m];
  }
  // explicit "18:00" / "18点00分"
  mm=t.match(/(\d{1,2}):(\d{2})/);
  if(mm) return [parseInt(mm[1]),parseInt(mm[2])];
  return null;
}
function matchDeadlineFromVoice(transcript){
  const t=transcript;
  const opts=deadlineQuickOptions();
  // Pick a base date from the day-of-week phrase, then layer time on top
  let baseDate=null;
  if(/今天|今儿/.test(t)) baseDate=new Date();
  else if(/明天|明儿/.test(t)){baseDate=new Date(); baseDate.setDate(baseDate.getDate()+1);}
  else if(/本周|这周|这礼拜|周末/.test(t)){baseDate=new Date(); baseDate.setDate(baseDate.getDate()+(7-baseDate.getDay()||7));}
  else if(/下周|下礼拜/.test(t)){baseDate=new Date(); baseDate.setDate(baseDate.getDate()+(7-baseDate.getDay()||7)+7);}
  else {
    // explicit YYYY-MM-DD or M月D日
    const m=t.match(/(\d{4})[-年/](\d{1,2})[-月/](\d{1,2})/);
    if(m){baseDate=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));}
  }
  if(!baseDate) return null;
  const time=_parseTimeFromVoice(t);
  if(time) baseDate.setHours(time[0],time[1],0,0);
  else baseDate.setHours(18,0,0,0); // default EOD when day mentioned without time
  return _isoDateTime(baseDate);
}
const _STAR_WORD={'一':1,'二':2,'两':2,'三':3,'四':4,'五':5};
function matchStarFromVoice(transcript){
  const t=transcript;
  const m=t.match(/([一二两三四五12345])\s*星/);
  if(m){
    const ch=m[1];
    return _STAR_WORD[ch] ?? parseInt(ch);
  }
  if(/最急|紧急|加急|火烧|马上/.test(t)) return 5;
  if(/不急|随便|有空|啥时候都行/.test(t)) return 1;
  return null;
}
function matchProjectFromVoice(transcript){
  if(/理享|招生/.test(transcript)) return '理享招生项目';
  if(/其他|别的|暂时/.test(transcript)) return '其他';
  return null;
}
const VOICE_MATCHERS={assignee:matchAssigneeFromVoice,deadline:matchDeadlineFromVoice,star:matchStarFromVoice,project:matchProjectFromVoice};

/* ── Generic Missing-Field Picker component ── */
/* MultiFieldPicker — one popup, all missing fields filled in one go.
   Pure render: parent owns `draft` state and passes onUpdate/onConfirm/onCancel. */
function MultiFieldPicker({task,missing,draft,onUpdate,onConfirm,onCancel}){
  const merged={...task,...draft};
  const allFilled=missing.every(f=>{
    const v=merged[f];
    return v!=null && (typeof v!=='string' || v.trim());
  });
  // datetime-local input wants "YYYY-MM-DDTHH:mm"
  const dateInputValue=(()=>{
    if(!merged.deadline) return '';
    const d=new Date(merged.deadline.includes('T')?merged.deadline:merged.deadline.replace(' ','T'));
    return isNaN(d)?'':_toLocalInputValue(d);
  })();
  const _row=(key,val)=>(
    <React.Fragment>
      <div className="mf-multi-summary-key">{key}</div>
      <div className={'mf-multi-summary-val'+(val?'':' empty')}>{val||'未填'}</div>
    </React.Fragment>
  );
  const _check=(picked)=>picked && <span className="mf-multi-label-pick">✓</span>;
  return (
    <div className="mf-multi">
      <div className="mf-multi-title">📝 任务确认 · 缺项请补</div>
      <div className="mf-multi-summary">
        {_row('📌 任务',merged.title)}
        {_row('👤 负责',merged.assignee)}
        {_row('📅 截止',_formatDeadline(merged.deadline))}
        {_row('⭐ 等级',merged.star?'★'.repeat(merged.star)+' ('+merged.star+'星)':'')}
        {_row('📁 项目',merged.project)}
      </div>

      {missing.includes('title') && (
        <div className="mf-multi-section">
          <div className="mf-multi-label"><span>📌 任务名</span>{_check(merged.title)}</div>
          <input className="mf-multi-input" value={merged.title||''} onChange={e=>onUpdate('title',e.target.value)} placeholder="输入任务名" />
        </div>
      )}

      {missing.includes('assignee') && (
        <div className="mf-multi-section">
          <div className="mf-multi-label"><span>👤 负责人</span>{_check(merged.assignee)}</div>
          <div className="mf-multi-btns">
            {assigneeOptions().map(o=>(
              <button key={String(o.value)} className={'mf-multi-btn'+(merged.assignee===o.value?' picked':'')} onClick={()=>onUpdate('assignee',o.value)}>{o.label}</button>
            ))}
          </div>
        </div>
      )}

      {missing.includes('deadline') && (
        <div className="mf-multi-section">
          <div className="mf-multi-label"><span>📅 截止时间</span>{_check(merged.deadline)}</div>
          <div className="mf-multi-btns">
            {deadlineQuickOptions().map(o=>(
              <button key={String(o.value)} className={'mf-multi-btn'+(merged.deadline===o.value?' picked':'')} onClick={()=>onUpdate('deadline',o.value)}>{o.label}</button>
            ))}
          </div>
          <div className="mf-multi-date">
            <input type="datetime-local" value={dateInputValue} onChange={e=>{
              if(!e.target.value) return;
              // datetime-local gives "YYYY-MM-DDTHH:mm" — convert to "YYYY-MM-DD HH:MM" for storage
              onUpdate('deadline',e.target.value.replace('T',' '));
            }} />
          </div>
        </div>
      )}

      {missing.includes('star') && (
        <div className="mf-multi-section">
          <div className="mf-multi-label"><span>⭐ 重要等级</span>{_check(merged.star)}</div>
          <div className="mf-multi-stars">
            {[1,2,3,4,5].map(n=>(
              <button key={n} className={'mf-multi-star'+(merged.star && merged.star>=n?' filled':'')} onClick={()=>onUpdate('star',n)} aria-label={n+'星'}>★</button>
            ))}
            {merged.star && <span className="mf-multi-star-label">{merged.star} 星</span>}
          </div>
        </div>
      )}

      {missing.includes('project') && (
        <div className="mf-multi-section">
          <div className="mf-multi-label"><span>📁 项目归属</span>{_check(merged.project)}</div>
          <div className="mf-multi-btns">
            {projectOptions().map(o=>(
              <button key={String(o.value)} className={'mf-multi-btn'+(merged.project===o.value?' picked':'')} onClick={()=>onUpdate('project',o.value)}>{o.label}</button>
            ))}
            <button className={'mf-multi-btn other'+(merged.project==='其他'?' picked':'')} onClick={()=>onUpdate('project','其他')}>📁 其他</button>
          </div>
        </div>
      )}

      <div className="mf-multi-acts">
        <button className="mf-multi-cancel" onClick={onCancel}>取消</button>
        <button className="mf-multi-confirm" disabled={!allFilled} onClick={()=>onConfirm(merged)}>{allFilled?'✓ 派单':'请把缺项补完'}</button>
      </div>
    </div>
  );
}

/* Voice Float — press & hold to talk with AI */
function VoiceFloat({tasks}){
  const [phase,setPhase]=useState('idle');
  const [status,setStatus]=useState('点击说话 · 可下达任务');
  const [bars,setBars]=useState([3,5,3,5,3]);
  const [pendingTask,setPendingTask]=useState(null); // 等待项目确认的任务
  const pendingTaskRef=useRef(null); // ref版，供recognition闭包访问
  const recogRef=useRef(null);
  const barTimerRef=useRef(null);
  const isRecRef=useRef(false);   // ref版phase，避免闭包旧值
  const gotResultRef=useRef(false); // 防止onend覆盖onresult
  const pickerListenRef=useRef(false); // 是否在等待语音选项目

  // Multi-field popup state — one combined picker for all missing fields
  const [draft,setDraft]=useState({});
  const draftRef=useRef({});
  const multiResolveRef=useRef(null);

  const updateDraft=(field,value)=>{
    setDraft(prev=>{const next={...prev,[field]:value};draftRef.current=next;return next;});
  };

  // Required slots for dispatch.
  // title/assignee/deadline: ask only if LLM didn't fill them.
  // star + project: ALWAYS shown — boss must explicitly confirm urgency and project bucket.
  // (LLM auto-fills priority='mid' even without an urgency cue, so we can't trust it
  //  as a real boss-supplied star — always require explicit confirmation.)
  const computeMissingFields=(task)=>{
    const out=[];
    for(const f of ['title','assignee','deadline']){
      const v=task[f];
      if(v==null || (typeof v==='string' && !v.trim())) out.push(f);
    }
    out.push('star','project');
    return out;
  };

  // Bridge LLM now returns `star` (1-5 int) directly — no display-time mapping needed.
  // PRIORITY_TO_STAR kept as a fallback for old-bridge responses (priority high/mid/low).
  const PRIORITY_TO_STAR={high:4,mid:3,low:2};
  // Star (1-5 int) → priority (low/mid/high string) for boss_tasks/tasks/frontend-actions
  // write. Lossy 5→3 projection is unavoidable until those columns become integer.
  const STAR_TO_PRIORITY={1:'low',2:'low',3:'mid',4:'high',5:'high'};

  // Show MultiFieldPicker; resolves with merged task (or null on cancel).
  const fillMissing=(task)=>{
    let cur={...task};
    // LLM may return date-only ("2026-05-12"); pad to date+EOD so it's a valid timestamp.
    if(typeof cur.deadline==='string') cur.deadline=_normalizeDeadline(cur.deadline);
    const missing=computeMissingFields(cur);
    if(missing.length===0) return Promise.resolve(cur);
    // Pre-fill draft.star from AI's pick. Prefer task.star (new bridge: LLM returns 1-5
    // directly); fall back to PRIORITY_TO_STAR[task.priority] for old-bridge compat.
    const initialDraft={};
    if(typeof cur.star==='number' && cur.star>=1 && cur.star<=5){
      initialDraft.star=cur.star;
    }else if(cur.priority && PRIORITY_TO_STAR[cur.priority]!=null){
      initialDraft.star=PRIORITY_TO_STAR[cur.priority];
    }
    setDraft(initialDraft);draftRef.current={...initialDraft};
    return new Promise(resolve=>{
      multiResolveRef.current=resolve;
      setPendingTask({parsed:cur,missing});
      pendingTaskRef.current={parsed:cur,missing};
      // brief intro + single voice attempt to fill what we can
      const intro='还差几项，按界面补，也可以一句话说出来。';
      setPhase('talking');setStatus('奇点提问中...');startBars();
      beepFn(1047,.05,0);beepFn(1319,.06,.1);
      makeTTS(intro).then(()=>{
        stopBars();
        // If popup was already closed (boss clicked 派单 / 取消 mid-TTS), don't start SR
        if(pendingTaskRef.current) startMultiVoiceListen(missing);
      });
    });
  };

  // Stop any active SR + cancel any in-flight TTS so the next stage (派单 / 已取消)
  // doesn't end up talking to a still-listening mic.
  const _silencePopupVoice=()=>{
    pickerListenRef.current=false;
    try{recogRef.current?.stop?.();}catch(_){}
    try{window.speechSynthesis.cancel();}catch(_){}
  };

  const onMultiConfirm=(merged)=>{
    _silencePopupVoice();
    // Boss's star pick (1-5 int) is the source of truth — overwrite any LLM-guessed priority.
    if(merged.star!=null) merged.priority=STAR_TO_PRIORITY[merged.star]||'mid';
    const r=multiResolveRef.current;
    multiResolveRef.current=null;
    setPendingTask(null);pendingTaskRef.current=null;
    setDraft({});draftRef.current={};
    if(r) r(merged);
  };

  const onMultiCancel=()=>{
    _silencePopupVoice();
    const r=multiResolveRef.current;
    multiResolveRef.current=null;
    setPendingTask(null);pendingTaskRef.current=null;
    setDraft({});draftRef.current={};
    if(r) r(null);
  };

  // One SR session after popup opens — try to fill ANY matchable field from a single utterance
  const startMultiVoiceListen=(missing)=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return;
    if(!pendingTaskRef.current) return; // popup already gone — don't start a stray SR
    // defensive: ensure no TTS is mid-playback when SR opens
    try{window.speechSynthesis.cancel();}catch(_){}
    pickerListenRef.current=true;
    const r=new SR();
    r.lang='zh-CN';r.continuous=false;r.interimResults=false;r.maxAlternatives=3;
    recogRef.current=r;
    setPhase('rec');setStatus('一句话补完，或者点按钮');startBars();
    r.onresult=ev=>{
      pickerListenRef.current=false;stopBars();setPhase('idle');
      if(!pendingTaskRef.current) return; // popup closed mid-recognition — drop the result
      const transcript=Array.from(ev.results[0]).map(a=>a.transcript).join(' ');
      const cur=pendingTaskRef.current?.parsed||{};
      const updates={};
      for(const f of missing){
        // For star/project, only treat as already-filled if boss explicitly picked
        // it in this popup session (draftRef). LLM's priority guess doesn't count.
        const already=(f==='star'||f==='project')?draftRef.current[f]:(draftRef.current[f]??cur[f]);
        if(already!=null && (typeof already!=='string' || already.trim())) continue;
        if(f==='title'){
          const t=transcript.trim();
          if(t) updates.title=t;
        }else{
          const m=VOICE_MATCHERS[f];
          if(m){
            const v=m(transcript);
            if(v!=null) updates[f]=v;
          }
        }
      }
      if(Object.keys(updates).length){
        setDraft(prev=>{const next={...prev,...updates};draftRef.current=next;return next;});
        setStatus('已识别 '+Object.keys(updates).length+' 项，确认或继续补');
      }else{
        setStatus('没听清，点按钮补');
      }
    };
    r.onerror=()=>{pickerListenRef.current=false;stopBars();setPhase('idle');};
    r.onend=()=>{if(pickerListenRef.current){pickerListenRef.current=false;stopBars();setPhase('idle');}};
    r.start();
  };

  const startBars=()=>{barTimerRef.current=setInterval(()=>setBars([...Array(5)].map(()=>Math.floor(Math.random()*9)+2)),110);};
  const stopBars=()=>{clearInterval(barTimerRef.current);setBars([3,5,3,5,3]);};

  // 自动保存婷婷声音
  useEffect(()=>{
    const saveTingting=()=>{
      const vs=window.speechSynthesis.getVoices();
      const v=vs.find(x=>x.name.includes('Tingting')||x.name.includes('婷婷'));
      if(v) localStorage.setItem('rv_voice_name',v.name);
    };
    saveTingting();
    window.speechSynthesis.addEventListener('voiceschanged',saveTingting);
    return()=>window.speechSynthesis.removeEventListener('voiceschanged',saveTingting);
  },[]);

  // 同步 pendingTask 到 ref（供异步回调访问最新值）
  useEffect(()=>{pendingTaskRef.current=pendingTask;},[pendingTask]);

  // 模糊匹配：从输入中找到成员标准名
  const fuzzyFindMember=(q)=>{
    const ql=q.toLowerCase();
    for(const [alias,name] of Object.entries(ALIAS_MAP)){
      if(ql.includes(alias)) return name;
    }
    return null;
  };

  // 校验并修正 assignee：如果 Claude 返回的不是标准名，尝试从别名中找
  const normalizeAssignee=(raw,fallback)=>{
    if(!raw) return fallback||null;
    const knownNames=Object.keys(MEMBER_ALIASES);
    if(knownNames.includes(raw)) return raw; // 已经是标准名
    // 在所有别名中查找
    const fromAlias=fuzzyFindMember(raw);
    if(fromAlias) return fromAlias;
    // 还找不到就用我们自己预检测到的
    return fallback||raw;
  };

  const TASK_WORDS=['让','安排','交代','交给','叫','派','负责','完成','跟进','处理','去做','做一下','帮我','通知','assign','let','ask','tell','做','搞','负责','推进','查','找','联系','汇报','整理','准备','提交','发送','确认'];
  const isTaskIntent=(q)=>{
    const ql=q.toLowerCase();
    const hasMember=fuzzyFindMember(ql)!==null;
    // 只要提到人名，就优先走任务路径，避免 AI 乱给建议
    if(hasMember) return true;
    const hasAction=TASK_WORDS.some(w=>ql.includes(w));
    return hasAction;
  };

  // 任务模式：先把模糊名字替换成标准名，再交给 AI 解析
  const parseTaskAI=async(q)=>{
    const today=new Date().toISOString().split('T')[0];
    // 把识别到的模糊名替换成标准中文名，方便 AI 理解
    let normalized=q;
    const found=fuzzyFindMember(q.toLowerCase());
    if(found){
      Object.values(MEMBER_ALIASES[found]||[]).forEach(alias=>{
        const re=new RegExp(alias,'gi');
        normalized=normalized.replace(re,found);
      });
    }
    const memberList=Object.keys(MEMBER_ALIASES).join('、');
    const res=await fetch(`${BRIDGE_URL}/api/ai/parse-task`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        query:q,
        normalized,
        today,
        members:Object.keys(MEMBER_ALIASES),
        fallback_assignee:found
      })
    });
    const d=await res.json();
    if(!d.ok)throw new Error(d.error||'任务解析失败');
    const parsed=d.task||{};
    // 兜底 + 别名标准化：确保 assignee 是系统里认识的标准中文名
    parsed.assignee=normalizeAssignee(
      parsed.assignee==='待定'?null:parsed.assignee,
      found
    );
    return parsed;
  };

  // 问答模式：只返回纯文字，绝不返回 JSON
  const askAI=async(q)=>{
    const res=await fetch(`${BRIDGE_URL}/api/ai/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q,tasks})
    });
    const d=await res.json();
    if(!d.ok)throw new Error(d.error||'问答失败');
    let answer=d.answer;
    if(typeof answer==='string'){
      try{answer=JSON.parse(answer);}catch(_){}
    }
    const text=(answer&&typeof answer==='object'?(answer.response||answer.reply||answer.text||answer.answer||answer.content):answer)||d.response||'';
    return String(text).trim();
  };

  const onErr=()=>{stopBars();setPhase('idle');setStatus('出错，请重试');setTimeout(()=>setStatus('点击说话 · 可下达任务'),3000);};

  const speak=(ans,noAutoResume=false)=>{
    setPhase('talking');setStatus(ans.length>30?ans.slice(0,30)+'…':ans);
    startBars();beepFn(1047,.05,0);beepFn(1319,.06,.1);
    makeTTS(ans).then(()=>{
      stopBars();
      setPhase('idle');setStatus('点击说话 · 可下达任务');
    });
  };

  // 主监听会话（可被 speak 回调 or handleClick 调用）
  const startMainListen=(isFirst=true)=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setStatus('请用Chrome浏览器');setTimeout(()=>setStatus('点击说话 · 可下达任务'),2000);return;}
    window.speechSynthesis.cancel();
    const r=new SR();
    r.lang='zh-CN';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
    recogRef.current=r;
    gotResultRef.current=false;
    setPhase('rec');
    setStatus(isFirst?'说吧，说完自动发送...':'继续说...');
    startBars();
    if(isFirst){beepFn(1047,.05,0);beepFn(1319,.05,.1);}

    r.onresult=ev=>{
      const transcript=Array.from(ev.results).map(x=>x[0].transcript).join('');
      const isFinal=ev.results[ev.results.length-1].isFinal;
      setStatus(`"${transcript}"`);
      if(isFinal){
        gotResultRef.current=true;
        stopBars();setPhase('proc');
        if(isTaskIntent(transcript)){
          parseTaskAI(transcript).then(async task=>{
            stopBars();
            try{
              const filled=await fillMissing(task);
              if(filled){
                await confirmAndDispatch(filled);
              }else{
                setPhase('idle');setStatus('已取消');
                setTimeout(()=>setStatus('点击说话 · 可下达任务'),2000);
              }
            }catch(e){console.error('[fillMissing]',e);onErr();}
          }).catch(onErr);
        } else {
          askAI(transcript).then(ans=>speak(ans)).catch(onErr);
        }
      }
    };

    r.onerror=ev=>{
      stopBars();setPhase('idle');
      const msg={'no-speech':'没检测到声音，再试试','audio-capture':'麦克风无法访问','not-allowed':'请允许麦克风权限','network':'网络错误'}[ev.error]||('识别错误:'+ev.error);
      setStatus(msg);setTimeout(()=>setStatus('点击说话 · 可下达任务'),3000);
    };
    r.onend=()=>{if(!gotResultRef.current){stopBars();setPhase('idle');setStatus('点击说话 · 可下达任务');}};
    r.start();
  };

  const handleClick=e=>{
    e.preventDefault();
    if(phase==='talking'||phase==='proc'){
      window.speechSynthesis.cancel();
      stopBars();setPhase('idle');setStatus('点击说话 · 可下达任务');return;
    }
    if(phase==='rec'){
      if(recogRef.current) recogRef.current.stop();
      return;
    }
    startMainListen(true);
  };

  // 接收已填完的 task，执行存档 + 通知
  // Stage C.5 — bridge owns persistence. Dashboard sends ONE call to /api/frontend-actions;
  // bridge creates executive_requests + outbox row + (via legacy_mirror) the boss_tasks/tasks
  // legacy rows. Dashboard no longer direct-writes Supabase here. Dispatch state writes
  // (qidian_notified / tg_sent / qidian_dispatched_at / qidian_dispatch_error) are also
  // owned by bridge — the API response carries enough info; failures land in the outbox
  // row's status, not in dashboard state.
  const confirmAndDispatch=async(task)=>{
    if(!task) return;
    const assignee=task.assignee||'';
    const proj=task.project||'其他';
    const projLabel=proj==='其他'?'其他项目':proj;
    const tid=Date.now();
    const requestCode='QR-FE-'+tid;
    const _recruitKW=['招生','招人','学生','辅导师','招聘','招募'];
    const _isRecruitTask=_recruitKW.some(kw=>(task.title||'').includes(kw)||(task.description||'').includes(kw));
    const _numM=(task.title||'').match(/(\d+)/);
    const _targetN=_isRecruitTask&&_numM?parseInt(_numM[1]):0;

    // Optimistic local kanban row. Use request_code as the React key — /api/tasks GET
    // returns the same id (no metadata.dashboard_id since legacy mirror was removed),
    // so the row matches itself across the 15s refetch instead of getting replaced
    // (which would visually "blink" the card).
    const localRow={id:requestCode,request_code:requestCode,name:task.title||'',assignee,deadline:task.deadline||null,priority:task.priority||'mid',status:'in-progress',blocker:'',files:[],notes:task.description||'',project:proj==='其他'?null:proj,createdAt:(task.deadline||new Date().toISOString().split('T')[0])};
    _RC_CACHE.set(String(requestCode),requestCode);
    window.dispatchEvent(new CustomEvent('walle_task_created',{detail:localRow}));

    // 韩笑+吴晓磊 协同任务：可视化双卡片，副任务也走 bridge（不触发第二次 Telegram 派单）。
    const RECRUIT_KW=['招生','招人','学生','辅导师','辅导'];
    const isRecruit=RECRUIT_KW.some(kw=>(task.title||'').includes(kw)||(task.description||'').includes(kw));
    if(isRecruit&&assignee==='韩笑'){
      const coworker='吴晓磊';
      const coRes=await bridgeFetch('/api/tasks',{method:'POST',body:{
        target_name:coworker,
        title:task.title||'',
        content:task.title||'',
        deadline_locked:task.deadline?(task.deadline+'T00:00:00Z'):null,
        star:priorityToStar(task.priority||'mid'),
        project:proj==='其他'?null:proj,
        notes:'协同韩笑：'+(task.description||''),
      }});
      const coRC=(coRes.ok && coRes.data && coRes.data.request_code) || (requestCode+'-co');
      const coLocalRow={...localRow,id:coRC,request_code:coRC,assignee:coworker,notes:'协同韩笑：'+(task.description||'')};
      window.dispatchEvent(new CustomEvent('walle_task_created',{detail:coLocalRow}));
    }

    // 主任务：交给 bridge 完成 ER + outbox + 派单 + 招生 metadata
    let queued=false;
    const r=await bridgeFetch('/api/frontend-actions',{method:'POST',body:{
      type:'assign_task',
      request_code:'QR-FE-'+tid,
      task_id:tid,
      title:task.title||'',
      assignee,
      deadline:task.deadline||null,
      priority:task.priority||'mid',
      project:projLabel,
      description:task.description||'',
    }});
    queued=!!(r.ok && r.data && r.data.ok);
    if(!queued) console.warn('[frontend-action失败]',r.error||r.data);
    // 招生 [target:N] — Stage C.5 redirects to bridge /progress endpoint instead of
    // embedding the regex tag in description. Mirror still backfills description for
    // legacy regex consumers during transition (Stage D removes them).
    if(queued && _targetN>0){
      bridgeFetch('/api/tasks/'+encodeURIComponent('QR-FE-'+tid)+'/progress',{
        method:'POST',
        body:{value:0,target:_targetN},
      });
    }

    // 4. 语音确认（speak 会自动恢复监听）
    const coSpeak=(isRecruit&&assignee==='韩笑')?' 吴晓磊也会协同跟进。':'';
    speak(queued
      ?'好的老板，任务已归入'+projLabel+'，奇点会通过协作群通知'+assignee+'跟进。'+coSpeak
      :'好的老板，任务已归入'+projLabel+'，但通知队列写入失败，请稍后在指令台重试。');
  };

  const btnClass='vf-btn'+(phase==='rec'?' rec':'')+(phase==='proc'||phase==='talking'?' proc':'');
  const statusClass='vf-status'+(phase==='rec'?' rec':'')+(phase==='proc'?' proc':'');

  return(
    <div className="vf-wrap">
      {pendingTask && pendingTask.missing && (
        <MultiFieldPicker
          task={pendingTask.parsed}
          missing={pendingTask.missing}
          draft={draft}
          onUpdate={updateDraft}
          onConfirm={onMultiConfirm}
          onCancel={onMultiCancel}
        />
      )}
      <div className={statusClass}>{status}</div>
      <button className={btnClass} onClick={handleClick}>
        {phase==='idle'?'🎙️':phase==='proc'?'🤔':(
          <div className="vf-bars">{bars.map((h,i)=><div key={i} className="vf-bar" style={{height:h+'px'}}/>)}</div>
        )}
      </button>
    </div>
  );
}

/* Task Form */
function TaskForm({task,onSave,onClose}){
  const [f,setF]=useState(task||{name:'',assignee:'',deadline:'',priority:'mid',status:'pending',blocker:'',files:[],notes:''});
  const fileRef=useRef(null);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const onFile=e=>{const ns=Array.from(e.target.files).map(x=>x.name);setF(p=>({...p,files:[...p.files,...ns]}));};
  const submit=e=>{e.preventDefault();if(!f.name.trim())return;onSave({...f,id:task?.id||Date.now(),createdAt:task?.createdAt||new Date().toISOString().split('T')[0]});};
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-head">
          <h2>{task?'编辑任务':'新建任务'}</h2>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        <form onSubmit={submit}>
          <div className="form-grid">
            <div className="fg full"><label>任务名称 *</label><input type="text" placeholder="请输入任务名称" value={f.name} onChange={e=>set('name',e.target.value)} required/></div>
            <div className="fg"><label>负责人</label><input type="text" placeholder="负责人姓名" value={f.assignee} onChange={e=>set('assignee',e.target.value)}/></div>
            <div className="fg"><label>截止时间</label><input type="datetime-local" value={f.deadline?(f.deadline.includes('T')?f.deadline.slice(0,16):f.deadline.replace(' ','T').slice(0,16)):''} onChange={e=>set('deadline',e.target.value?e.target.value.replace('T',' '):'')}/></div>
            <div className="fg"><label>优先级</label>
              <select value={f.priority} onChange={e=>set('priority',e.target.value)}>
                <option value="high">高优先级</option><option value="mid">中优先级</option><option value="low">低优先级</option>
              </select>
            </div>
            <div className="fg"><label>完成状态</label>
              <select value={f.status} onChange={e=>set('status',e.target.value)}>
                <option value="pending">未开始</option><option value="in-progress">进行中</option><option value="completed">已完成</option><option value="blocked">已卡点</option>
              </select>
            </div>
            <div className="fg"><label>所属项目</label>
              <select value={f.project||''} onChange={e=>set('project',e.target.value||null)}>
                <option value="">— 无 —</option>
                {PROJECTS.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            {f.status==='blocked'&&<div className="fg full"><label>卡点描述</label><textarea placeholder="描述卡点原因及所需支持..." value={f.blocker} onChange={e=>set('blocker',e.target.value)}/></div>}
            <div className="fg full"><label>备注反馈</label><textarea placeholder="进展说明、备注信息..." value={f.notes} onChange={e=>set('notes',e.target.value)}/></div>
            <div className="fg full"><label>上传交付文件</label>
              <div className="file-zone" onClick={()=>fileRef.current?.click()}>
                <input ref={fileRef} type="file" multiple style={{display:'none'}} onChange={onFile}/>
                <div style={{color:'#16A34A',fontWeight:700,marginBottom:2}}>📎 点击上传交付文件</div>
                <div style={{color:'#9CA3AF',fontSize:'.75rem'}}>支持多文件</div>
              </div>
              {f.files.length>0&&<div style={{marginTop:7}}>{f.files.map((n,i)=><span key={i} className="file-tag">📄 {n.length>22?n.slice(0,22)+'…':n}<span style={{cursor:'pointer',color:'#BE123C',marginLeft:3}} onClick={e=>{e.stopPropagation();setF(p=>({...p,files:p.files.filter((_,j)=>j!==i)}));}}>✕</span></span>)}</div>}
            </div>
          </div>
          <div className="modal-foot">
            <button type="button" className="btn btn-ghost" onClick={onClose}>取消</button>
            <button type="submit" className="btn btn-primary">{task?'保存修改':'创建任务'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function Toast({msg,onClose}){
  const isMsgNotif=msg&&(msg.startsWith('📩')||msg.startsWith('💰'));
  useEffect(()=>{const t=setTimeout(onClose,isMsgNotif?5000:2500);return()=>clearTimeout(t);},[]);
  return <div className="toast" style={isMsgNotif?{borderLeftColor:'#6366f1',background:'#f5f3ff'}:{}}>{isMsgNotif?'':'✓ '}{msg}</div>;
}

/* ===== Project Org Chart ===== */
function ProjOrgChart({proj}){
  const members=PROJECT_MEMBERS[proj]||[];
  if(members.length===0) return null;
  const leader=members.find(m=>m.leader);
  const rest=members.filter(m=>!m.leader);
  return(
    <div className="proj-org">
      <div className="proj-org-title">🏢 项目组织架构</div>
      {leader&&(
        <div className="proj-org-leader-wrap">
          <div className="proj-org-node leader">
            <div className="org-av">{leader.name.slice(0,1)}</div>
            <div className="org-name">{leader.name}</div>
            <div className="org-role">{leader.role}</div>
          </div>
        </div>
      )}
      {leader&&rest.length>0&&(
        <div className="proj-org-connector">
          <div className="proj-org-vline"/>
          <div style={{width:'70%',height:2,background:'#BBF7D0'}}/>
        </div>
      )}
      {rest.length>0&&(
        <div className="proj-org-members-row">
          {rest.map(m=>(
            <div key={m.name} className="proj-org-node">
              <div className="org-av">{m.name.slice(0,1)}</div>
              <div className="org-name">{m.name}</div>
              <div className="org-role">{m.role||'—'}</div>
            </div>
          ))}
        </div>
      )}
      {!leader&&(
        <div className="proj-org-members-row">
          {members.map(m=>(
            <div key={m.name||m} className="proj-org-node">
              <div className="org-av">{(m.name||m).slice(0,1)}</div>
              <div className="org-name">{m.name||m}</div>
              <div className="org-role">{m.role||'—'}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ===== Project Body (org chart + member list) ===== */
function ProjectBody({proj,persons,bossTasks,openPerson,setOpenPerson,statusDot,buildLog,S,onEdit,onDelete,section}){
  const fixedRaw=PROJECT_MEMBERS[proj]||[];
  const bts=bossTasks||[];

  // 为某人从 boss_tasks 构建流水账 — Stage D.5: prefer structured _events from
  // /api/messages over description-string parsing. Fall back to legacy regex if a row
  // is missing _events (e.g. immediately after creation, before next refetch).
  const buildBTLog=function(name){
    var entries=[];
    bts.forEach(function(bt){
      var created=bt.created_at?new Date(bt.created_at).toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'):'';
      if(bt.assignee===name) entries.push({dot:'issue',text:'📋 下达任务：'+bt.title,time:created});
      var events=bt._events;
      if(Array.isArray(events) && events.length>0){
        events.forEach(function(ev){
          var t=ev.created_at?new Date(ev.created_at).toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'):'';
          var text=ev.text||'';
          if(ev.direction==='executive_to_qidian'){
            var who=ev.from_name||bt.assignee||'';
            if(who===name) entries.push({dot:'reply',text:'💬 '+who+'回复：'+text,time:t});
          } else if(ev.direction==='boss_to_qidian'){
            if(bt.assignee===name) entries.push({dot:'ack',text:'✅ 老板已阅：'+text,time:t});
          }
        });
      } else {
        (bt.description||'').split('\n').filter(Boolean).forEach(function(line){
          var m=line.match(/^\[([^\]]+)\]\s*(.+)/);
          if(!m) return;
          var time=m[1],content=m[2];
          if(/回复[：:]/.test(content)){
            var rm=content.match(/回复[：:](.+?)[:：]/);
            var replier=rm?rm[1].trim():'';
            if(replier===name) entries.push({dot:'reply',text:'💬 '+content,time:time});
          } else if(/老板已阅/.test(content)){
            if(bt.assignee===name) entries.push({dot:'ack',text:'✅ '+content,time:time});
          }
        });
      }
    });
    entries.sort(function(a,b){return a.time>b.time?1:-1;});
    return entries;
  };
  const fixedNames=fixedRaw.map(function(m){return m.name||m;});
  const taskNames=Object.keys(persons);
  const seen={};
  const allNames=[];
  fixedNames.concat(taskNames).forEach(function(n){if(!seen[n]){seen[n]=1;allNames.push(n);}});

  // --- org chart ---
  const members=fixedRaw;
  const leader=members.filter(function(m){return m.leader;})[0]||null;
  const rest=members.filter(function(m){return !m.leader;});

  return(
    <div className="proj-body">
      {section!=='progress'&&members.length>0&&(
        <div className="proj-org">
          <div className="proj-org-title">🏢 项目组织架构</div>
          {leader&&(
            <div style={{display:'flex',justifyContent:'center',marginBottom:0}}>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                <div style={{position:'relative'}}>
                  <div style={{width:48,height:48,borderRadius:'50%',background:'linear-gradient(135deg,#F59E0B,#D97706)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',fontWeight:800,color:'#fff',boxShadow:'0 2px 8px rgba(245,158,11,.35)'}}>{leader.name.slice(0,1)}</div>
                  <div className="pt-badge">PT{getPT(leader.name)}</div>
                </div>
                <div style={{fontSize:'.75rem',fontWeight:700,color:'#111827'}}>{leader.name}</div>
                <div style={{fontSize:'.6rem',color:'#6B7280',textAlign:'center'}}>{leader.role}</div>
              </div>
            </div>
          )}
          {leader&&rest.length>0&&(
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',margin:'4px 0'}}>
              <div style={{width:2,height:14,background:'#BBF7D0'}}/>
              <div style={{width:'70%',height:2,background:'#BBF7D0'}}/>
            </div>
          )}
          {rest.length>0&&(
            <div style={{display:'flex',justifyContent:'center',gap:10,flexWrap:'wrap',padding:'0 4px'}}>
              {rest.map(function(m){return(
                <div key={m.name} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,minWidth:60}}>
                  <div style={{position:'relative'}}>
                    <div style={{width:40,height:40,borderRadius:'50%',background:'linear-gradient(135deg,#22C55E,#16A34A)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.9rem',fontWeight:800,color:'#fff'}}>{m.name.slice(0,1)}</div>
                    <div className="pt-badge">PT{getPT(m.name)}</div>
                  </div>
                  <div style={{fontSize:'.72rem',fontWeight:700,color:'#111827'}}>{m.name}</div>
                  <div style={{fontSize:'.6rem',color:'#6B7280',textAlign:'center',maxWidth:68,lineHeight:1.3}}>{m.role||'—'}</div>
                </div>
              );})}
            </div>
          )}
          {!leader&&members.length>0&&(
            <div style={{display:'flex',justifyContent:'center',gap:10,flexWrap:'wrap',padding:'0 4px'}}>
              {members.map(function(m){return(
                <div key={m.name||m} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,minWidth:60}}>
                  <div style={{position:'relative'}}>
                    <div style={{width:40,height:40,borderRadius:'50%',background:'linear-gradient(135deg,#22C55E,#16A34A)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.9rem',fontWeight:800,color:'#fff'}}>{(m.name||m).slice(0,1)}</div>
                    <div className="pt-badge">PT{getPT(m.name||m)}</div>
                  </div>
                  <div style={{fontSize:'.72rem',fontWeight:700,color:'#111827'}}>{m.name||m}</div>
                  <div style={{fontSize:'.6rem',color:'#6B7280',textAlign:'center',maxWidth:68,lineHeight:1.3}}>{m.role||'—'}</div>
                </div>
              );})}
            </div>
          )}
        </div>
      )}
      {/* --- 目标任务进度条（仅 progress 视图） — Stage D.4: helpers replace regex --- */}
      {section==='progress'&&(function(){
        var targetBts=bts.filter(btIsRecruit);
        if(targetBts.length===0) return null;
        return React.createElement('div',{style:{marginBottom:14}},
          React.createElement('div',{className:'proj-org-section-title'},'🎯 目标任务进度'),
          targetBts.map(function(bt){
            var target=btTargetCount(bt)||0;
            var progress=btProgressCount(bt);
            var pct=target>0?Math.min(100,Math.round(progress/target*100)):0;
            return React.createElement('div',{key:bt.id,style:{background:'#fff',borderRadius:10,padding:'10px 12px',marginBottom:8,border:'1px solid #E5E7EB'}},
              React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
                React.createElement('div',{style:{fontSize:'.8rem',fontWeight:700,color:'#111827'}},bt.title),
                React.createElement('div',{style:{fontSize:'.72rem',color:'#6B7280'}},bt.assignee)
              ),
              React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
                React.createElement('div',{style:{flex:1,height:8,background:'#F3F4F6',borderRadius:4,overflow:'hidden'}},
                  React.createElement('div',{style:{width:pct+'%',height:'100%',background:pct>=80?'#10B981':pct>=40?'#F59E0B':'#3B82F6',borderRadius:4,transition:'width .4s'}})
                ),
                React.createElement('div',{style:{fontSize:'.72rem',fontWeight:700,color:'#374151',minWidth:70,textAlign:'right'}},
                  progress+'/'+target+' （'+pct+'%）'
                )
              )
            );
          })
        );
      })()}
      {/* --- member task list --- */}
      {section!=='org'&&allNames.length>0&&<div className="proj-org-section-title">📋 成员工作任务 &amp; 进度</div>}
      {section!=='org'&&allNames.length===0&&<div style={{textAlign:'center',padding:'18px 0',color:'#9CA3AF',fontSize:'.82rem'}}>🗂️ 暂无任务，可在新建任务时选择此项目</div>}
      {section!=='org'&&allNames.map(function(name){
        var memberInfo=fixedRaw.filter(function(m){return (m.name||m)===name;})[0]||null;
        var role=memberInfo&&memberInfo.role||'';
        var ptasks=persons[name]||[];
        var pkey=proj+'|'+name;
        var isPersonOpen=openPerson===pkey;
        var pDone=ptasks.filter(function(t){return t.status==='completed';}).length;
        var pBlock=ptasks.filter(function(t){return t.status==='blocked';}).length;
        // 完成百分比：优先用 bridge metadata 的 target/progress；回退到任务完成数
        var pctLabel=(function(){
          var bt=(bts||[]).filter(function(b){return b.assignee===name&&btIsRecruit(b);}).sort(function(a,b){return (b.id||0)-(a.id||0);})[0];
          if(bt){
            var target=btTargetCount(bt)||0;
            var prog=btProgressCount(bt);
            if(target>0) return Math.round(prog/target*100)+'%';
          }
          if(ptasks.length>0) return Math.round(pDone/ptasks.length*100)+'%';
          return null;
        })();
        return(
          <div key={pkey} className="person-card">
            <div className="person-card-hd" onClick={function(){setOpenPerson(isPersonOpen?null:pkey);}}>
              <div style={{position:'relative',flexShrink:0}}>
                <div className="person-avatar">{name.slice(0,1)}</div>
                <div className="pt-badge">PT{getPT(name)}</div>
              </div>
              <div className="person-info">
                <div className="person-name">{name}{role?React.createElement('span',{style:{fontSize:'.6rem',color:'#6B7280',fontWeight:400,marginLeft:5}},role):null}</div>
                <div className="person-tasks-cnt">{ptasks.length>0?(ptasks.length+'项任务 · 完成'+(pctLabel||pDone)+(pBlock>0?' · ⚠️'+pBlock+'卡点':'')):'暂无任务'}</div>
              </div>
              <div className="person-status-dots">
                {ptasks.map(function(t){return React.createElement('span',{key:t.id,style:{width:8,height:8,borderRadius:'50%',background:statusDot(t.status),display:'inline-block'},title:t.name});})
                }
                {ptasks.length===0&&React.createElement('span',{style:{fontSize:'.65rem',color:'#D1D5DB'}},'—')}
              </div>
            </div>
            {isPersonOpen&&(
              <div className="person-card-body">
                {(function(){
                  var btLog=buildBTLog(name);
                  if(ptasks.length===0&&btLog.length===0) return React.createElement('div',{style:{padding:'10px 13px',color:'#9CA3AF',fontSize:'.8rem'}},'暂无互动记录');
                  if(ptasks.length===0&&btLog.length>0) return React.createElement('div',{className:'person-task-log',style:{margin:'8px 10px 8px'}},
                    React.createElement('div',{style:{fontSize:'.68rem',fontWeight:700,color:'#374151',marginBottom:6}},'📜 交互记录'),
                    btLog.map(function(l,i){return React.createElement('div',{key:i,style:{display:'flex',gap:6,marginBottom:4}},
                      React.createElement('span',{style:{color:l.dot==='reply'?'#3B82F6':l.dot==='ack'?'#22C55E':l.dot==='issue'?'#F59E0B':'#9CA3AF',flexShrink:0}},'•'),
                      React.createElement('span',{style:{flex:1,fontSize:'.7rem'}},''+l.text),
                      l.time&&React.createElement('span',{style:{color:'#D1D5DB',fontSize:'.6rem',whiteSpace:'nowrap'}},l.time)
                    );})
                  );
                  return null;
                })()}
                {ptasks.length>0&&(function(){
                  var btLog=buildBTLog(name);
                  if(btLog.length===0) return null;
                  return React.createElement('div',{className:'person-task-log',style:{margin:'0 10px 8px'}},
                    React.createElement('div',{style:{fontSize:'.68rem',fontWeight:700,color:'#374151',marginBottom:6}},'📜 交互记录'),
                    btLog.map(function(l,i){return React.createElement('div',{key:i,style:{display:'flex',gap:6,marginBottom:4}},
                      React.createElement('span',{style:{color:l.dot==='reply'?'#3B82F6':l.dot==='ack'?'#22C55E':l.dot==='issue'?'#F59E0B':'#9CA3AF',flexShrink:0}},'•'),
                      React.createElement('span',{style:{flex:1,fontSize:'.7rem'}},''+l.text),
                      l.time&&React.createElement('span',{style:{color:'#D1D5DB',fontSize:'.6rem',whiteSpace:'nowrap'}},l.time)
                    );})
                  );
                })()}
                {ptasks.map(function(t){
                  var logs=buildLog(t);
                  return(
                    <div key={t.id}>
                      <div className="person-task-row">
                        <span style={{width:8,height:8,borderRadius:'50%',background:statusDot(t.status),display:'inline-block',flexShrink:0}}/>
                        <span className="person-task-name">{t.name}</span>
                        <span className={'badge '+(S[t.status]?S[t.status].cls:'')} style={{fontSize:'.6rem'}}>{S[t.status]?S[t.status].emoji:''} {S[t.status]?S[t.status].label:''}</span>
                        {(onEdit||onDelete)&&(
                          <div className="person-task-actions">
                            {onEdit&&<button className="pt-edit" onClick={e=>{e.stopPropagation();onEdit(t);}}>编辑</button>}
                            {onDelete&&<button className="pt-del" onClick={e=>{e.stopPropagation();if(confirm('确认删除「'+t.name+'」？'))onDelete(t.id);}}>删除</button>}
                          </div>
                        )}
                      </div>
                      {logs.length>1&&(
                        <div className="person-task-log">
                          {logs.map(function(l,i){return(
                            <div key={i} style={{display:'flex',gap:6,marginBottom:3}}>
                              <span style={{color:l.dot==='blocked'?'#E11D48':l.dot==='note'?'#3B82F6':'#9CA3AF',flexShrink:0}}>•</span>
                              <span style={{flex:1}}>{l.text}</span>
                              {l.time&&<span style={{color:'#D1D5DB',fontSize:'.6rem',whiteSpace:'nowrap'}}>{l.time}</span>}
                            </div>
                          );})}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ===== Project Finance Inline (drawer — 实时从 Supabase 读取) ===== */
function ProjectFinanceInline({proj}){
  const [records,setRecords]=useState(null); // null=loading, []=empty
  const [err,setErr]=useState(null);

  const load=()=>{
    setErr(null);
    SB.from('finance_records')
      .select('*')
      .eq('project',proj)
      .order('created_at',{ascending:false})
      .limit(50)
      .then(({data,error})=>{
        if(error){setErr('数据加载失败');setRecords([]);}
        else setRecords(data||[]);
      });
  };
  useEffect(()=>{
    load();
    const t=setInterval(load,30000);
    return()=>clearInterval(t);
  },[proj]);

  if(records===null) return <div style={{padding:'24px',textAlign:'center',color:'#9CA3AF',fontSize:'.8rem'}}>⏳ 加载中...</div>;

  const income=records.filter(r=>r.type==='income').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const expense=records.filter(r=>r.type==='expense').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const net=income-expense;
  const fmt=n=>n>=10000?(n/10000).toFixed(1)+'万':n.toLocaleString();

  if(records.length===0) return(
    <div style={{padding:'28px 16px',textAlign:'center'}}>
      <div style={{fontSize:'2rem',marginBottom:8}}>💰</div>
      <div style={{color:'#6B7280',fontSize:'.82rem',fontWeight:600}}>暂无财务记录</div>
      <div style={{color:'#9CA3AF',fontSize:'.7rem',marginTop:4}}>成员向奇点汇报收支后，数据将自动录入</div>
    </div>
  );

  const kpis=[
    {icon:'📈',label:'总收入',val:'¥'+fmt(income),cls:'green',color:'#16A34A'},
    {icon:'📉',label:'总支出',val:'¥'+fmt(expense),cls:'red',color:'#DC2626'},
    {icon:'💎',label:'净收益',val:(net>=0?'+':'')+'¥'+fmt(Math.abs(net)),cls:net>=0?'blue':'red',color:net>=0?'#1D4ED8':'#DC2626'},
    {icon:'📑',label:'记录条数',val:records.length+'条',cls:'amber',color:'#92400E'},
  ];

  const typeIcon=t=>t==='income'?{icon:'💰',bg:'#F0FDF4'}:{icon:'💸',bg:'#FFF7F7'};

  return(
    <div style={{padding:'12px 14px'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8,marginBottom:12}}>

/* ===== Task Drawer ===== */
function TaskDrawer({tasks,bossTasks=[],filter,onClose,onEdit,onDelete}){
  const [openProj,setOpenProj]=useState(new Set()); // 默认全收起，点击才展开
  const [openPerson,setOpenPerson]=useState(null); // 展开的人员key "项目|姓名"
  const [openSection,setOpenSection]=useState({}); // {proj: 'org'|'finance'|'progress'|null}
  const toggleSection=(proj,sec)=>setOpenSection(p=>({...p,[proj]:p[proj]===sec?null:sec}));

  const titleMap={all:'全部任务',completed:'已完成','in-progress':'进行中',blocked:'已卡点',overdue:'逾期中'};
  const today=new Date();

  // 筛选
  const filtered=filter==='all'?tasks
    :filter==='overdue'?tasks.filter(t=>t.status!=='completed'&&t.deadline&&new Date(t.deadline)<today)
    :tasks.filter(t=>t.status===filter);

  // 按项目分组：无项目或不在列表里的，归入 '其他'
  const groups={};
  PROJECTS.forEach(p=>{groups[p]=[];});
  groups['其他']=[];
  filtered.forEach(t=>{
    const p=t.project&&PROJECTS.includes(t.project)?t.project:'其他';
    groups[p].push(t);
  });

  // 项目内按人分组
  const byPerson=(taskList)=>{
    const map={};
    taskList.forEach(t=>{
      const key=t.assignee||'未分配';
      if(!map[key]) map[key]=[];
      map[key].push(t);
    });
    return map;
  };

  // 构建进展日志
  const buildLog=(t)=>{
    const logs=[];
    const fmt=d=>d?new Date(d).toLocaleDateString('zh-CN'):'';
    logs.push({dot:'pending',text:`创建 → 分配给 ${t.assignee||'—'}`,time:fmt(t.createdAt)});
    if(t.notes) t.notes.split('\n').filter(Boolean).forEach(line=>{
      const m=line.match(/^\[(.+?)\]\s*(.+)/);
      logs.push({dot:'note',text:m?m[2]:line,time:m?m[1]:''});
    });
    if(t.blocker) logs.push({dot:'blocked',text:`🚧 ${t.blocker}`,time:''});
    if(t.status==='completed') logs.push({dot:'',text:'✅ 已完成',time:fmt(t.deadline)});
    return logs;
  };

  const statusDot=(s)=>({completed:'#22C55E','in-progress':'#3B82F6',blocked:'#E11D48',pending:'#9CA3AF'}[s]||'#9CA3AF');

  const projOrder=[...PROJECTS,'其他'];
  const toggleProj=(proj)=>{
    setOpenProj(prev=>{
      const next=new Set(prev);
      next.has(proj)?next.delete(proj):next.add(proj);
      return next;
    });
  };

  return(
    <div className="drawer-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="drawer">
        <div className="drawer-head">
          <div className="drawer-title">
            <span>{{all:'📋',completed:'✅','in-progress':'🔄',blocked:'🚧',overdue:'⏰'}[filter]||'📋'}</span>
            {titleMap[filter]||filter}
            <span style={{fontSize:'.75rem',fontWeight:400,color:'#9CA3AF'}}>（{filtered.length}项）</span>
          </div>
          <button className="drawer-close" onClick={onClose}>✕</button>
        </div>
        <div className="drawer-body">
          {projOrder.map(proj=>{
            const pts=groups[proj]||[];
            const isNamed=PROJECTS.includes(proj); // w / 理享招生项目
            // '其他' 无任务时不显示
            if(!isNamed&&pts.length===0) return null;
            const isOpen=openProj.has(proj);
            const doneN=pts.filter(t=>t.status==='completed').length;
            const blockN=pts.filter(t=>t.status==='blocked').length;
            const persons=byPerson(pts);
            return(
              <div key={proj} className="proj-group">
                <div className={`proj-group-hd${isOpen?' open':''}`} onClick={()=>toggleProj(proj)}>
                  <div className="proj-name">
                    <span>{isNamed?'🗂️':'📁'}</span>
                    {proj}
                    {pts.length>0&&<span className={`proj-badge${blockN>0?' block':doneN===pts.length?' ':' warn'}`}>
                      {doneN}/{pts.length} 完成
                    </span>}
                    {isNamed&&pts.length===0&&<span className="proj-badge" style={{background:'#E5E7EB',color:'#6B7280'}}>待分配</span>}
                    {blockN>0&&<span className="proj-badge block">⚠️ {blockN}卡点</span>}
                  </div>
                  <span className={`proj-chevron${isOpen?' open':''}`}>▶</span>
                </div>
                {isOpen&&(
                  <div>
                    {[{sec:'org',icon:'🏢',label:'项目组织架构'},{sec:'finance',icon:'💰',label:'财务情况'},{sec:'progress',icon:'📊',label:'工作进度'}].map(({sec,icon,label})=>{
                      const isSecOpen=openSection[proj]===sec;
                      return(
                        <div key={sec}>
                          <div className="proj-sub-hd" onClick={()=>toggleSection(proj,sec)}>
                            <span className="sub-icon">{icon}</span>
                            <span className="sub-label">{label}</span>
                            <span className={`proj-chevron${isSecOpen?' open':''}`}>▶</span>
                          </div>
                          {isSecOpen&&(
                            <div className="proj-sub-body">
                              {sec==='org'&&React.createElement(ProjectBody,{proj,persons,bossTasks,openPerson,setOpenPerson,statusDot,buildLog,S,onEdit,onDelete,section:'org'})}
                              {sec==='finance'&&React.createElement(ProjectFinanceInline,{proj})}
                              {sec==='progress'&&React.createElement(ProjectBody,{proj,persons,bossTasks,openPerson,setOpenPerson,statusDot,buildLog,S,onEdit,onDelete,section:'progress'})}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ===== Pinball Game Page ===== */
function ThinkingPage({onBack}){
  const [score,setScore]=useState(0);
  const [best,setBest]=useState(0);
  const [started,setStarted]=useState(false);
  const [missKey,setMissKey]=useState(0);

  const areaRef=useRef(null);
  const ballRef=useRef(null);
  const paddleRef=useRef(null);
  const animRef=useRef(null);
  const gRef=useRef({ballX:0,ballY:0,dx:3,dy:4,paddleX:0,score:0});

  const BALL_R=22;
  const PADDLE_W=96;
  const PADDLE_H=13;
  const PADDLE_BOTTOM=78;

  const resetBall=(W,H)=>{
    const g=gRef.current;
    g.ballX=W/2+(Math.random()-.5)*W*.3;
    g.ballY=H*.22;
    const speed=3.5;
    const ang=(Math.random()-.5)*1.2;
    g.dx=Math.sin(ang)*speed*(Math.random()>.5?1:-1);
    g.dy=Math.cos(ang)*speed;
  };

  useEffect(()=>{
    if(!started) return;
    const area=areaRef.current;
    if(!area) return;
    // wait one frame for layout
    const rid=requestAnimationFrame(()=>{
      const ball=ballRef.current;
      const paddle=paddleRef.current;
      if(!ball||!paddle) return;
      const W=area.clientWidth||350;
      const H=area.clientHeight||480;
      const g=gRef.current;
      resetBall(W,H);
      g.paddleX=(W-PADDLE_W)/2;
      g.score=0;
      paddle.style.width=PADDLE_W+'px';

      const tick=()=>{
        const W2=area.clientWidth||350;
        const H2=area.clientHeight||480;
        const paddleTop=H2-PADDLE_BOTTOM-PADDLE_H;
        g.ballX+=g.dx;
        g.ballY+=g.dy;
        // Wall bounces
        if(g.ballX-BALL_R<2){g.dx=Math.abs(g.dx);g.ballX=BALL_R+2;}
        if(g.ballX+BALL_R>W2-2){g.dx=-Math.abs(g.dx);g.ballX=W2-BALL_R-2;}
        if(g.ballY-BALL_R<4){g.dy=Math.abs(g.dy);g.ballY=BALL_R+4;}
        // Paddle hit
        if(g.dy>0&&
           g.ballY+BALL_R>=paddleTop&&
           g.ballY+BALL_R<=paddleTop+PADDLE_H+Math.abs(g.dy)*2&&
           g.ballX>=g.paddleX-4&&g.ballX<=g.paddleX+PADDLE_W+4){
          const hitRatio=(g.ballX-g.paddleX)/PADDLE_W; // 0..1
          const bounceAngle=(hitRatio-.5)*2.2; // -1.1..1.1 rad
          const spd=Math.min(Math.sqrt(g.dx*g.dx+g.dy*g.dy)*1.055,15);
          g.dx=Math.sin(bounceAngle)*spd;
          g.dy=-Math.max(2,Math.cos(bounceAngle)*spd);
          g.ballY=paddleTop-BALL_R;
          g.score++;
          setScore(g.score);
          setBest(p=>Math.max(p,g.score));
        }
        // Miss
        if(g.ballY>H2+BALL_R*3){
          g.score=0;
          setScore(0);
          setMissKey(k=>k+1);
          resetBall(W2,H2);
        }
        // Render via direct DOM
        ball.style.left=g.ballX+'px';
        ball.style.top=g.ballY+'px';
        paddle.style.left=g.paddleX+'px';
        animRef.current=requestAnimationFrame(tick);
      };
      animRef.current=requestAnimationFrame(tick);
    });
    return()=>{cancelAnimationFrame(rid);cancelAnimationFrame(animRef.current);};
  },[started]);

  const handleSlider=e=>{
    const area=areaRef.current;
    if(!area) return;
    const W=area.clientWidth||350;
    gRef.current.paddleX=(parseInt(e.target.value)/100)*(W-PADDLE_W);
  };

  return(
    <div className="pinball-page">
      <div className="pinball-topbar">
        <button className="pinball-back" onClick={onBack}>← 返回</button>
        <div className="pinball-score-box">
          {started
            ?<><div className="pinball-score">🏆 {score}</div>{best>0&&<div className="pinball-best">最高 {best} 分</div>}</>
            :<div style={{color:'#64748B',fontWeight:700,fontSize:'.95rem'}}>🎮 弹珠小游戏</div>
          }
        </div>
        <div style={{width:60}}/>
      </div>

      <div className="pinball-area" ref={areaRef}>
        {started?(
          <>
            <div className="pinball-wall-top"/>
            <div className="pinball-wall-l"/><div className="pinball-wall-r"/>
            <div className="pinball-ball" ref={ballRef}>🤔</div>
            <div className="pinball-paddle" ref={paddleRef}
              style={{bottom:PADDLE_BOTTOM+'px',position:'absolute'}}/>
            {missKey>0&&<div key={missKey} className="pinball-miss-fx">💥 接不住！</div>}
          </>
        ):(
          <div className="pinball-start-wrap">
            <div className="pinball-start-fig">🤔</div>
            <div className="pinball-start-hint">
              接住弹来弹去的思考小人<br/>
              每接一次 +1分 · 接不住清零<br/>
              <span style={{fontSize:'.75rem',color:'#334155'}}>越打越快，挑战高分！</span>
            </div>
            <button className="pinball-start-btn" onClick={()=>setStarted(true)}>
              🎮 开始游戏
            </button>
          </div>
        )}
      </div>

      {started&&(
        <div className="pinball-slider-wrap">
          <div className="pinball-slider-hint">← 拖动滑块移动挡板 →</div>
          <input type="range" className="pinball-slider"
            min="0" max="100" defaultValue="50"
            onInput={handleSlider} onChange={handleSlider}/>
        </div>
      )}
    </div>
  );
}
