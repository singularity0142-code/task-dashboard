function App(){
  const [tasks,setTasks]=useState([]);
  const [bossTasks,setBossTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [rosterVersion,setRosterVersion]=useState(0);
  const [showForm,setShowForm]=useState(false);
  const [editTask,setEditTask]=useState(null);
  const [toast,setToast]=useState(null);
  const [page,setPage]=useState('home');
  const [drawer,setDrawer]=useState(null);

  useEffect(()=>{
    loadRoster().finally(()=>setRosterVersion(v=>v+1));
  },[]);

  // Stage D.4 — bossTasks state is now derived from /api/tasks (executive_requests).
  // We keep the React state name `bossTasks` because downstream consumers (PT calc,
  // recruit progress display) still spell it that way; the shape now mirrors the
  // bridge ER row plus the legacy `description` field rebuilt from `notes` so any
  // remaining text-display callsites keep working until E removes them.
  // New-reply notifications are now driven by D.3's /api/messages poll, not by
  // observing description-length deltas.
  const lastFinIdRef=useRef(0);     // 上次已见 finance_record id (still SB-direct; finance migration is a future stage)

  useEffect(()=>{
    const fetchBT=async()=>{
      // Stage D.4 + D.5 — fetch tasks AND recent message events in parallel; attach
      // events onto each bossTask row so per-person activity timeline (buildBTLog in
      // ProjectBody) can switch from description regex to structured events.
      const [tasksRes, msgsRes] = await Promise.all([
        bridgeFetch('/api/tasks?limit=100'),
        bridgeFetch('/api/messages?limit=300'),
      ]);
      if(!tasksRes.ok || !tasksRes.data || !Array.isArray(tasksRes.data.tasks)) return;
      const eventsByCode={};
      if(msgsRes.ok && msgsRes.data && Array.isArray(msgsRes.data.messages)){
        msgsRes.data.messages.forEach(m=>{
          if(!m.request_code) return;
          (eventsByCode[m.request_code]=eventsByCode[m.request_code]||[]).push(m);
        });
      }
      const rows=tasksRes.data.tasks.map(t=>({
        id:(t.metadata&&t.metadata.dashboard_id)||t.request_code,
        request_code:t.request_code,
        title:t.title||t.content||'',
        assignee:t.target_name||'',
        priority:t.star>=4?'high':t.star<=2?'low':'mid',
        status:_BRIDGE_TO_DASH_STATUS[t.status]||'pending',
        description:t.notes||t.content||'',
        project:t.project||'',
        deadline:t.deadline_locked||null,
        created_at:t.created_at||new Date().toISOString(),
        target_count:t.metadata&&t.metadata.target_count,
        progress_count:t.metadata&&t.metadata.progress_count,
        metadata:t.metadata||{},
        _events:eventsByCode[t.request_code]||[],
      }));
      setBossTasks(rows);
    };

    const fetchFin=()=>{
      const since=lastFinIdRef.current;
      if(!since) return;
      SB.from('finance_records').select('*').gt('id',since).order('id',{ascending:true}).limit(10).then(({data})=>{
        if(!data||data.length===0) return;
        data.forEach(r=>{
          const sign=r.type==='income'?'+':'-';
          const amt=r.amount>0?` ${sign}¥${r.amount}`:'';
          setToast(`💰 ${r.reporter||''}：${r.category}${amt}`);
        });
        lastFinIdRef.current=data[data.length-1].id;
      });
    };

    SB.from('finance_records').select('id').order('id',{ascending:false}).limit(1).then(({data})=>{
      if(data&&data.length>0) lastFinIdRef.current=data[0].id;
    });

    fetchBT();
    const timer=setInterval(()=>{fetchBT();fetchFin();},15000);
    const onAck=()=>fetchBT();
    window.addEventListener('boss_task_acked',onAck);
    return()=>{clearInterval(timer);window.removeEventListener('boss_task_acked',onAck);};
  },[]);

  // Stage D.1 — kanban fetches from bridge GET /api/tasks. metadata.dashboard_id is the
  // stable React key (set by legacy_mirror at create time). Cancelled tasks are filtered.
  useEffect(()=>{
    bridgeFetch('/api/tasks?limit=200').then(r=>{
      if(r.ok && r.data && Array.isArray(r.data.tasks)){
        const visible=r.data.tasks.filter(t=>t.status!=='cancelled').map(bridgeTaskToDashTask);
        visible.forEach(t=>{if(t.id!=null && t.request_code) _RC_CACHE.set(String(t.id),t.request_code);});
        setTasks(visible);
      }
      setLoading(false);
    });
  },[]);

  // 计算每人 PT 值（完成比例/10，取整），存全局供所有页面读取
  useEffect(()=>{
    const map={};
    tasks.forEach(t=>{
      if(!t.assignee) return;
      if(!map[t.assignee]) map[t.assignee]={total:0,done:0};
      map[t.assignee].total++;
      if(t.status==='completed') map[t.assignee].done++;
    });
    const ptMap={};
    Object.entries(map).forEach(([name,{total,done}])=>{
      ptMap[name]=total>0?Math.floor(done/total*10):0;
    });
    // 叠加 bridge metadata 中含 target/progress 的招生任务（替代旧 [target:N][progress:M] 正则）
    bossTasks.forEach(bt=>{
      if(!bt.assignee) return;
      const target=btTargetCount(bt);
      if(!target) return;
      const progress=btProgressCount(bt);
      const btPt=Math.floor(progress/target*10);
      const name=bt.assignee;
      if(ptMap[name]==null||btPt>ptMap[name]) ptMap[name]=btPt;
    });
    window.__ptMap=ptMap;
  },[tasks,bossTasks]);

  // 监听语音任务写入事件，立刻同步到看板
  useEffect(()=>{
    const handler=e=>{
      const r=e.detail;
      setTasks(p=>{
        if(p.find(t=>t.id===r.id)) return p; // 去重
        return [...p,dbToTask(r)];
      });
      setToast(`📋 任务已添加：${r.name||r.title||''}`);
    };
    window.addEventListener('walle_task_created',handler);
    return()=>window.removeEventListener('walle_task_created',handler);
  },[]);

  const notify=msg=>setToast(msg);
  // Stage C.1 — Edit button: PATCH bridge instead of direct SB write. Bridge mirror
  // backfills boss_tasks/tasks during transition (Stage E removes mirror).
  // Stage C.5 — New-task path: POST /api/tasks for form-created tasks too. Bridge
  // mirror creates legacy rows. Voice-driven confirmAndDispatch keeps using
  // /api/frontend-actions until later in this stage (separate flow).
  const save=async t=>{
    if(editTask){
      const rc=t.request_code||editTask.request_code||await getRequestCodeForBossTask(t.id);
      if(!rc){notify('找不到对应工单（bridge）'); return;}
      const r=await bridgeFetch('/api/tasks/'+encodeURIComponent(rc),{method:'PATCH',body:dashTaskToBridgePatch(t)});
      if(!r.ok){notify('保存失败：'+(r.error||'bridge')); return;}
      // Optimistic local update — bridge mirror keeps tasks/boss_tasks consistent
      setTasks(p=>p.map(x=>x.id===t.id?{...x,...t}:x));
      notify('任务已更新');
    } else {
      const r=await bridgeFetch('/api/tasks',{method:'POST',body:{
        target_name:t.assignee||'',
        title:t.name||'',
        content:t.name||'',
        deadline_locked:t.deadline?(t.deadline+'T00:00:00Z'):null,
        star:priorityToStar(t.priority),
        project:t.project||null,
        notes:t.notes||null,
      }});
      if(!r.ok){notify('创建失败：'+(r.error||'bridge')); return;}
      // bridge generated dashboard_id via mirror; refetch this row to populate full local state
      // (cheap fallback: optimistic with placeholder id; real id comes back on next 15s poll)
      const placeholder={...t,request_code:r.data&&r.data.request_code,id:t.id||Date.now()};
      setTasks(p=>[...p,placeholder]);
      notify('任务已创建');
    }
    setShowForm(false);setEditTask(null);
  };
  // Stage C.3 — Delete: /cancel endpoint.
  const del=async id=>{
    const t=tasks.find(x=>x.id===id);
    const rc=(t&&t.request_code)||await getRequestCodeForBossTask(id);
    if(!rc){notify('找不到对应工单'); return;}
    const r=await bridgeFetch('/api/tasks/'+encodeURIComponent(rc)+'/cancel',{method:'POST'});
    if(!r.ok){notify('删除失败：'+(r.error||'bridge')); return;}
    setTasks(p=>p.filter(t=>t.id!==id));
    notify('已删除');
  };
  // Stage C.2 — Status cycle: drives the bridge state machine.
  // Mapping (dashboard SCYCLE → bridge action):
  //   pending → in-progress: POST /dispatch (filling/pending_confirm → in_progress)
  //   in-progress → blocked: POST /phase {phase:'blocked'} (status stays in_progress)
  //   blocked → completed:   POST /deliver (in_progress → delivered)
  //   completed → pending:   POST /cancel then... no clean path; treat as no-op for now
  const cycle=async id=>{
    const task=tasks.find(t=>t.id===id);
    if(!task) return;
    const i=(SCYCLE.indexOf(task.status)+1)%SCYCLE.length;
    const ns=SCYCLE[i];
    const rc=task.request_code||await getRequestCodeForBossTask(id);
    if(!rc){notify('找不到对应工单'); return;}
    let r;
    if(ns==='in-progress'){
      r=await bridgeFetch('/api/tasks/'+encodeURIComponent(rc)+'/dispatch',{method:'POST'});
    } else if(ns==='blocked'){
      r=await bridgeFetch('/api/tasks/'+encodeURIComponent(rc)+'/phase',{method:'POST',body:{phase:'blocked'}});
    } else if(ns==='completed'){
      r=await bridgeFetch('/api/tasks/'+encodeURIComponent(rc)+'/deliver',{method:'POST',body:{}});
    } else if(ns==='pending'){
      // No clean state-machine reverse from completed → filling. Skip the bridge call;
      // local UI moves on. Stage E will reconcile semantics.
      r={ok:true};
    }
    if(!r.ok){notify('状态切换失败：'+(r.error||'bridge')); return;}
    setTasks(p=>p.map(t=>t.id===id?{...t,status:ns}:t));
  };
  if(loading)return(<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,background:'linear-gradient(150deg,#F0FDF4,#F8FAFC,#ECFDF5)'}}><div style={{width:36,height:36,border:'3px solid #22C55E',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 1s linear infinite'}}/><div style={{color:'#6B7280',fontSize:'.88rem'}}>连接数据库中...</div></div>);

  const today=new Date();today.setHours(0,0,0,0);
  const total=tasks.length;
  const done=tasks.filter(t=>t.status==='completed').length;
  const doing=tasks.filter(t=>t.status==='in-progress').length;
  const blocked=tasks.filter(t=>t.status==='blocked').length;
  const overdue=tasks.filter(t=>t.status!=='completed'&&t.deadline&&new Date(t.deadline)<today).length;
  const rate=total?Math.round(done/total*100):0;

  if(page==='leaderboard') return <><LeaderboardPage onBack={()=>setPage('home')}/>{toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}</>;
  if(page==='home') return <><HomePage tasks={tasks} onNav={setPage}/><VoiceFloat tasks={tasks}/>{toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}</>;
  if(page==='finance') return <><FinancePage onBack={()=>setPage('home')}/><Avatar tasks={tasks}/><VoiceFloat tasks={tasks}/>{toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}</>;
  if(page==='unknown') return <><ThinkingPage onBack={()=>setPage('home')}/>{toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}</>;

  return(
    <div className="app">
      <div className="nav-tabs" style={{marginBottom:16}}>
        <div className="nav-tab" style={{flex:'0 0 auto',padding:'8px 12px',fontSize:'.78rem',color:'#9CA3AF'}} onClick={()=>setPage('home')}>← 首页</div>
        <div className={`nav-tab${page==='tasks'?' active':''}`} onClick={()=>setPage('tasks')}>📋 任务看板</div>
        <div className={`nav-tab org${page==='org'?' active':''}`} onClick={()=>setPage('org')}>⚔ 战队图谱</div>
      </div>

      {page==='tasks'&&(<>
      <div className="stats-grid">
        <div className={`stat-card s-total${drawer==='all'?' active-filter':''}`} onClick={()=>setDrawer(d=>d==='all'?null:'all')}><div className="stat-num">{total}</div><div className="stat-label">全部任务</div></div>
        <div className={`stat-card s-done${drawer==='completed'?' active-filter':''}`} onClick={()=>setDrawer(d=>d==='completed'?null:'completed')}><div className="stat-num">{done}</div><div className="stat-label">已完成</div></div>
        <div className={`stat-card s-doing${drawer==='in-progress'?' active-filter':''}`} onClick={()=>setDrawer(d=>d==='in-progress'?null:'in-progress')}><div className="stat-num">{doing}</div><div className="stat-label">进行中</div></div>
        <div className={`stat-card s-blocked${drawer==='blocked'?' active-filter':''}`} onClick={()=>setDrawer(d=>d==='blocked'?null:'blocked')}><div className="stat-num">{blocked}</div><div className="stat-label">已卡点</div></div>
        <div className={`stat-card s-overdue${drawer==='overdue'?' active-filter':''}`} onClick={()=>setDrawer(d=>d==='overdue'?null:'overdue')}><div className="stat-num">{overdue}</div><div className="stat-label">逾期中</div></div>
      </div>

      <div className="card">
        <div className="prog-row"><span style={{fontWeight:700,fontSize:'.9rem'}}>整体完成率</span><span className="prog-rate">{rate}%</span></div>
        <div className="prog-bar"><div className="prog-fill" style={{width:`${rate}%`}}/></div>
      </div>

      <div className="card">
        <div className="row-between">
          <div className="sec-title">任务列表</div>
          <button className="add-btn" onClick={()=>{setEditTask(null);setShowForm(true);}}>＋ 新建任务</button>
        </div>
        {tasks.length===0?(
          <div className="empty"><div style={{fontSize:'2.5rem',marginBottom:10}}>📋</div><div style={{fontWeight:600,marginBottom:4}}>暂无任务</div><div style={{fontSize:'.83rem'}}>点击「新建任务」开始添加</div></div>
        ):(
          <>
            <div style={{overflowX:'auto'}}>
              <table className="task-table">
                <thead><tr><th>任务</th><th>负责人</th><th>截止日期</th><th>优先级</th><th>状态</th><th>交付文件</th><th></th></tr></thead>
                <tbody>
                  {tasks.map(t=>{
                    const ov=t.status!=='completed'&&t.deadline&&new Date(t.deadline)<today;
                    return(
                      <tr key={t.id}>
                        <td style={{maxWidth:260}}>
                          <div className="task-name">{t.name}</div>
                          {t.status==='blocked'&&t.blocker&&<div className="task-block">▲ {t.blocker}</div>}
                          {t.notes&&<div className="task-sub">{t.notes.length>48?t.notes.slice(0,48)+'…':t.notes}</div>}
                        </td>
                        <td><span className="chip">{t.assignee||'—'}</span></td>
                        <td style={{whiteSpace:'nowrap',fontSize:'.82rem'}}>
                          {t.deadline?_formatDeadline(t.deadline):'—'}
                          {ov&&<span className="ov">逾期</span>}
                        </td>
                        <td><span className={P[t.priority]?.cls}>{P[t.priority]?.e} {P[t.priority]?.label}</span></td>
                        <td><span className={`badge ${S[t.status]?.cls}`} onClick={()=>cycle(t.id)} title="点击切换状态">{S[t.status]?.emoji} {S[t.status]?.label}</span></td>
                        <td style={{minWidth:80}}>
                          {t.files?.length>0?t.files.map((f,i)=><span key={i} className="file-tag">📄 {f.length>12?f.slice(0,12)+'…':f}</span>):<span style={{color:'#D1D5DB',fontSize:'.75rem'}}>—</span>}
                        </td>
                        <td style={{whiteSpace:'nowrap'}}>
                          <button className="btn btn-ghost btn-sm" style={{marginRight:5}} onClick={()=>{setEditTask(t);setShowForm(true);}}>编辑</button>
                          <button className="btn btn-del btn-sm" onClick={()=>del(t.id)}>删除</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div className="mobile-cards">
              {tasks.map(t=>{
                const ov=t.status!=='completed'&&t.deadline&&new Date(t.deadline)<today;
                return(
                  <div key={t.id} className="m-card">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'start',marginBottom:7}}>
                      <div style={{fontWeight:700,flex:1,marginRight:8,fontSize:'.9rem'}}>{t.name}</div>
                      <span className={`badge ${S[t.status]?.cls}`} onClick={()=>cycle(t.id)}>{S[t.status]?.emoji} {S[t.status]?.label}</span>
                    </div>
                    <div style={{fontSize:'.78rem',color:'#6B7280',display:'flex',flexWrap:'wrap',gap:'6px 12px'}}>
                      <span>👤 {t.assignee||'—'}</span>
                      {t.deadline&&<span>📅 {_formatDeadline(t.deadline)}{ov&&<span className="ov">逾期</span>}</span>}
                      <span className={P[t.priority]?.cls}>{P[t.priority]?.e} {P[t.priority]?.label}</span>
                    </div>
                    {t.status==='blocked'&&t.blocker&&<div className="task-block" style={{marginTop:5}}>▲ {t.blocker}</div>}
                    {t.files?.length>0&&<div style={{marginTop:5}}>{t.files.map((f,i)=><span key={i} className="file-tag">📄 {f.length>18?f.slice(0,18)+'…':f}</span>)}</div>}
                    <div style={{display:'flex',gap:7,marginTop:9}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>{setEditTask(t);setShowForm(true);}}>编辑</button>
                      <button className="btn btn-del btn-sm" onClick={()=>del(t.id)}>删除</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      <div className="card">
        <div className="sec-title">数据看板</div>
        <div className="chart-grid">
          <div>
            <div style={{fontSize:'.82rem',color:'#6B7280',fontWeight:600,marginBottom:11}}>状态分布</div>
            <Donut tasks={tasks}/>
          </div>
          <div>
            <div style={{fontSize:'.82rem',color:'#6B7280',fontWeight:600,marginBottom:11}}>优先级分布</div>
            {['high','mid','low'].map(p=>{
              const cnt=tasks.filter(t=>t.priority===p).length;
              const pct=total?cnt/total*100:0;
              return(
                <div key={p} className="pri-bar-wrap">
                  <div className="pri-bar-label"><span className={P[p].cls}>{P[p].e} {P[p].label}优先级</span><span style={{fontWeight:700}}>{cnt}</span></div>
                  <div className="pri-bar-bg"><div className="pri-bar-fill" style={{width:`${pct}%`,background:p==='high'?'#DC2626':p==='mid'?'#D97706':'#16A34A'}}/></div>
                </div>
              );
            })}
            <div className="summary-box">
              <div style={{fontSize:'.78rem',color:'#6B7280',fontWeight:700}}>今日概况</div>
              <div className="summary-grid">
                <div className="summary-cell"><div className="summary-num" style={{color:'#16A34A'}}>{rate}%</div><div className="summary-lbl">完成率</div></div>
                <div className="summary-cell"><div className="summary-num" style={{color:overdue>0?'#DC2626':'#16A34A'}}>{overdue}</div><div className="summary-lbl">逾期任务</div></div>
                <div className="summary-cell"><div className="summary-num" style={{color:'#9F1239'}}>{blocked}</div><div className="summary-lbl">卡点任务</div></div>
                <div className="summary-cell"><div className="summary-num" style={{color:'#1D4ED8'}}>{doing}</div><div className="summary-lbl">进行中</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      </>)}

      {page==='org'&&<OrgPage/>}

      {showForm&&<TaskForm task={editTask} onSave={save} onClose={()=>{setShowForm(false);setEditTask(null);}}/>}
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
      <VoiceFloat tasks={tasks}/>
      <Avatar tasks={tasks}/>
      {drawer&&<TaskDrawer tasks={tasks} bossTasks={bossTasks} filter={drawer} onClose={()=>setDrawer(null)} onEdit={t=>{setEditTask(t);setShowForm(true);}} onDelete={del}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
